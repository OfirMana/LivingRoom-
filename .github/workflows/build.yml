name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore pinned packages
        run: nuget restore ofirManaFamily.sln -NonInteractive
      - name: Build Release
        run: msbuild ofirManaFamily.sln /t:Rebuild /p:Configuration=Release /m /v:minimal /nologo
      - name: Package Windows app
        shell: powershell
        run: .\scripts\Package-LivingRoom.ps1 -OutputPath "$env:RUNNER_TEMP\LivingRoom-Windows-x64.zip"
      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: LivingRoom-Windows-x64
          path: |
            ${{ runner.temp }}/LivingRoom-Windows-x64.zip
            ${{ runner.temp }}/LivingRoom-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
